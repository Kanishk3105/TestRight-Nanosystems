                        - cell [ref=f12e903]:
                          - text: 3D only where position means something.
                          - subscript [ref=f12e904]: Rings are pipeline stages, stars are postings. Each scene has an accessible list and a static fallback.
                      - row [ref=f12e905]:
                        - cell [ref=f12e906]:
                          - text: Motion communicates state.
                          - subscript [ref=f12e907]: Things rise when they arrive, light up when they're met, and stand still when you ask for reduced motion.
                        - cell [ref=f12e908]:
                          - text: You stay in control.
                          - subscript [ref=f12e909]: Resume data is reviewed before it's saved, sensitive answers are confirmed every time, and agents propose rather than act.
