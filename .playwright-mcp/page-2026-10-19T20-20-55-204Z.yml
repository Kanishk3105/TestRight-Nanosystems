                    - heading "Why CareerOS" [level=2] [ref=f12e404]
                    - 'link "Permalink: Why CareerOS" [ref=f12e405] [cursor=pointer]':
                      - /url: "#why-careeros"
                  - paragraph [ref=f12e408]: "A job search usually lives in a dozen places: a resume file, job boards, a spreadsheet of applications, the same form questions answered again and again, interview notes, half-remembered goals. None of them know about each other."
                  - paragraph [ref=f12e409]: "CareerOS keeps one career record and builds everything on it:"
                  - list [ref=f12e410]:
                    - listitem [ref=f12e411]:
                      - strong [ref=f12e412]: Your profile is the source of truth.
                      - text: Your resume fills it — but only with what you review and keep.
                    - listitem [ref=f12e413]:
                      - strong [ref=f12e414]: Every role is scored against it
                      - text: with a deterministic matcher, and every recommendation says
                      - emphasis [ref=f12e415]: why
                      - text: and
                      - emphasis [ref=f12e416]: what's missing
                      - text: .
                    - listitem [ref=f12e417]:
                      - strong [ref=f12e418]: Applying reuses what CareerOS already knows
                      - text: — profile fields and answers you chose to remember — and applies to exactly the posting you picked.
                    - listitem [ref=f12e419]:
                      - strong [ref=f12e420]: The pipeline, interview practice and analytics
                      - text: all read from the same record, so Control can tell you the single most useful thing to do next.
                  - paragraph [ref=f12e421]: No number on screen is invented. Scores come from the matcher, readiness is a count of named checks, and rates come from your own outcomes.
