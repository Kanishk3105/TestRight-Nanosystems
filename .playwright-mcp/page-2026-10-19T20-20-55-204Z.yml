                            - text: ·
                            - code [ref=f12e458]: /app/welcome
                          - text: Start with your resume Upload a PDF, Word (.docx) or text file. CareerOS reads it deterministically — name, contact, links, roles, education, skills, projects.
                        - cell [ref=f12e459]:
                          - subscript [ref=f12e460]:
                            - code [ref=f12e461]: "02"
                            - text: ·
                            - code [ref=f12e462]: /app/profile/resume/:id
                          - text: Review what it read Every value shows the resume line it came from. Keep, correct or untick — nothing reaches your profile until you save.
                      - row [ref=f12e463]:
                        - cell [ref=f12e464]:
                          - subscript [ref=f12e465]:
                            - code [ref=f12e466]: "03"
                            - text: ·
                            - code [ref=f12e467]: /app/welcome
                          - text: Fill only the gaps Onboarding asks just for what the profile still lacks — target roles, work mode, phone — and never asks again.
                        - cell [ref=f12e468]:
                          - subscript [ref=f12e469]:
                            - code [ref=f12e470]: "04"
                            - text: ·
                            - code [ref=f12e471]: /app/recommendations
                          - text: See roles that fit, and why Every active posting is scored against your profile and sorted into high alignment, good fit, stretch and skill-building.
                      - row [ref=f12e472]:
