                          - subscript [ref=f12e474]:
                            - code [ref=f12e475]: "05"
                            - text: ·
                            - code [ref=f12e476]: /app/jobs/:jobId/apply
                          - text: Easy Apply Known answers are filled in, only the unknown ones are asked, sensitive ones are confirmed by you — then it applies to that exact posting.
                        - cell [ref=f12e477]:
                          - subscript [ref=f12e478]:
                            - code [ref=f12e479]: "06"
                            - text: ·
                            - code [ref=f12e480]: /app/applications
                          - text: Track every application A ten-stage pipeline with enforced transitions, deadlines, follow-ups, activities and the record of exactly what was sent.
