                            - text: ·
                            - code [ref=f7e494]: /app/welcome
                          - text: Start with your resume Upload a PDF, Word (.docx) or text file. CareerOS reads it deterministically — name, contact, links, roles, education, skills, projects.
                        - cell [ref=f7e495]:
                          - subscript [ref=f7e496]:
                            - code [ref=f7e497]: "02"
                            - text: ·
                            - code [ref=f7e498]: /app/profile/resume/:id
                          - text: Review what it read Every value shows the resume line it came from. Keep, correct or untick — nothing reaches your profile until you save.
                      - row [ref=f7e499]:
                        - cell [ref=f7e500]:
                          - subscript [ref=f7e501]:
                            - code [ref=f7e502]: "03"
                            - text: ·
                            - code [ref=f7e503]: /app/welcome
                          - text: Fill only the gaps Onboarding asks just for what the profile still lacks — target roles, work mode, phone — and never asks again.
                        - cell [ref=f7e504]:
                          - subscript [ref=f7e505]:
                            - code [ref=f7e506]: "04"
                            - text: ·
                            - code [ref=f7e507]: /app/recommendations
                          - text: See roles that fit, and why Every active posting is scored against your profile and sorted into high alignment, good fit, stretch and skill-building.
                      - row [ref=f7e508]:
                        - cell [ref=f7e509]:
                          - subscript [ref=f7e510]:
                            - code [ref=f7e511]: "05"
                            - text: ·
                            - code [ref=f7e512]: /app/jobs/:jobId/apply
                          - text: Easy Apply Known answers are filled in, only the unknown ones are asked, sensitive ones are confirmed by you — then it applies to that exact posting.
                        - cell [ref=f7e513]:
                          - subscript [ref=f7e514]:
                            - code [ref=f7e515]: "06"
                            - text: ·
                            - code [ref=f7e516]: /app/applications
                          - text: Track every application A ten-stage pipeline with enforced transitions, deadlines, follow-ups, activities and the record of exactly what was sent.
                      - row [ref=f7e517]:
