                  - generic [ref=f7e438]:
                    - heading "Why CareerOS" [level=2] [ref=f7e439]
                    - 'link "Permalink: Why CareerOS" [ref=f7e440] [cursor=pointer]':
                      - /url: "#why-careeros"
                  - paragraph [ref=f7e443]: "A job search usually lives in a dozen places: a resume file, job boards, a spreadsheet of applications, the same form questions answered again and again, interview notes, half-remembered goals. None of them know about each other."
                  - paragraph [ref=f7e444]: "CareerOS keeps one career record and builds everything on it:"
                  - list [ref=f7e445]:
                    - listitem [ref=f7e446]:
                      - strong [ref=f7e447]: Your profile is the source of truth.
                      - text: Your resume fills it — but only with what you review and keep.
                    - listitem [ref=f7e448]:
                      - strong [ref=f7e449]: Every role is scored against it
                      - text: with a deterministic matcher, and every recommendation says
                      - emphasis [ref=f7e450]: why
                      - text: and
                      - emphasis [ref=f7e451]: what's missing
                      - text: .
                    - listitem [ref=f7e452]:
                      - strong [ref=f7e453]: Applying reuses what CareerOS already knows
                      - text: — profile fields and answers you chose to remember — and applies to exactly the posting you picked.
                    - listitem [ref=f7e454]:
                      - strong [ref=f7e455]: The pipeline, interview practice and analytics
                      - text: all read from the same record, so Control can tell you the single most useful thing to do next.
                  - paragraph [ref=f7e456]: No number on screen is invented. Scores come from the matcher, readiness is a count of named checks, and rates come from your own outcomes.
                  - paragraph [ref=f7e457]:
                    - link [ref=f7e458] [cursor=pointer]:
                      - /url: /Kanishk3105/CareerOS/blob/main/docs/assets/divider.svg
