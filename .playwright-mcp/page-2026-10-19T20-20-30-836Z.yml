                  - table [ref=f7e944]:
                    - rowgroup [ref=f7e945]:
                      - row [ref=f7e946]:
                        - cell [ref=f7e947]:
                          - text: A system, not a set of screens.
                          - subscript [ref=f7e948]: Every page reads from the same career record and feeds the next step; Control ties them together.
                        - cell [ref=f7e949]:
                          - text: Your data is the colour.
                          - subscript [ref=f7e950]: A near-black canvas and neutral chrome; one accent — chartreuse — means only attention or "you are here".
                      - row [ref=f7e951]:
                        - cell [ref=f7e952]:
                          - text: Every number is real.
                          - subscript [ref=f7e953]: Scores from the matcher, readiness as named checks, rates from outcomes. Unfinished parts carry honest status tags.
                        - cell [ref=f7e954]:
                          - text: 3D only where position means something.
                          - subscript [ref=f7e955]: Rings are pipeline stages, stars are postings. Each scene has an accessible list and a static fallback.
                      - row [ref=f7e956]:
                        - cell [ref=f7e957]:
                          - text: Motion communicates state.
                          - subscript [ref=f7e958]: Things rise when they arrive, light up when they're met, and stand still when you ask for reduced motion.
                        - cell [ref=f7e959]:
                          - text: You stay in control.
                          - subscript [ref=f7e960]: Resume data is reviewed before it's saved, sensitive answers are confirmed every time, and agents propose rather than act.
